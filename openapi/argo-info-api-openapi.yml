openapi: 3.2.0
info:
  title: Argo Workflows Info API
  description: REST API for Argo Workflows, a Kubernetes-native workflow engine for orchestrating parallel jobs. Provides endpoints for managing workflows, workflow templates, cron workflows, and related resources.
  version: 3.5.0
  contact:
    name: Argo Project
    url: https://argoproj.github.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{host}:{port}/api/v1
  description: Argo Workflows Server
  variables:
    host:
      default: localhost
    port:
      default: '2746'
security:
- BearerAuth: []
tags:
- name: Info
  description: Server information and version endpoints
paths:
  /info:
    get:
      operationId: getInfo
      summary: Argo Workflows Argo Get Server Info
      description: Returns information about the Argo Workflows server including version and managed namespace.
      tags:
      - Info
      responses:
        '200':
          description: Server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /version:
    get:
      operationId: getVersion
      summary: Argo Workflows Argo Get Server Version
      description: Returns the version of the Argo Workflows server.
      tags:
      - Info
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    InfoResponse:
      type: object
      properties:
        managedNamespace:
          type: string
          description: The namespace managed by this Argo server
        links:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              scope:
                type: string
              url:
                type: string
    Version:
      type: object
      properties:
        version:
          type: string
        buildDate:
          type: string
        gitCommit:
          type: string
        gitTag:
          type: string
        gitTreeState:
          type: string
        goVersion:
          type: string
        compiler:
          type: string
        platform:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Argo Workflows API token authentication
