  name: Argo Events API
  description: >-
    Kubernetes-native API for the Argo Events event-driven automation framework. Exposes CRD-based resources
    including EventSource, EventBus, and Sensor for triggering Argo Workflows and Kubernetes actions in
    response to over 20 event types including webhooks, S3, cron, and messaging queues.
  humanURL: https://argoproj.github.io/argo-events/APIs/
  tags:
